services:
  jenkins-controller:
    image: jenkins/jenkins:lts
    container_name: jenkins-controller
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    networks:
      - jenkins-network

  ssh-agent:
    build:
      context: .
      dockerfile: Dockerfile.jenkins-agent
    container_name: ssh-agent
    environment:
      - JENKINS_AGENT_SSH_PUBKEY=${JENKINS_AGENT_SSH_PUBKEY}
    volumes:
      - jenkins_agent_volume:/home/jenkins/agent
    depends_on:
      - jenkins-controller
    networks:
      - jenkins-network


  ansible-agent:
    build:
      context: .
      dockerfile: Dockerfile.ansible_agent
    container_name: ansible-agent
    ports:
      - "2222:22"
    networks:
      - jenkins-network
    volumes:
      - ./secrets/ansible/id_ed25519:/tmp/ansible_key:ro
      - ./secrets/jenkins_ansible.pub:/tmp/jenkins_ansible.pub:ro
      - ./ansible:/home/jenkins/ansible:ro
    depends_on:
      - jenkins-controller


  test-server:
    build:
      context: .
      dockerfile: Dockerfile.test_server
    container_name: test-server
    ports:
      - "8081:80"
    networks:
      - jenkins-network
    volumes:
      - ./secrets/ansible/id_ed25519.pub:/tmp/ansible_key.pub:ro


volumes:
  jenkins_home:
  jenkins_agent_volume:

networks:
  jenkins-network:
    driver: bridge